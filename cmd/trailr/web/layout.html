<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{if .Titel}}{{.Titel}} · {{end}}{{.App}}</title>
<link rel="stylesheet" href="/statisch/stil.css">
<link rel="icon" href="/statisch/zeichen.svg" type="image/svg+xml">
{{block "kopfzeilen" .}}{{end}}
</head>
<body>
<a class="sprung" href="#hauptinhalt">Zum Inhalt</a>
<header class="kopf">
  <a class="marke" href="/"><img src="/statisch/zeichen.svg" alt="" width="28" height="28">{{.App}}</a>
  <nav aria-label="Hauptmenü">{{template "nav" .}}</nav>
  {{$wer := or .Nutzer.Name .Nutzer.Nutzer}}
  {{if $wer}}<div class="wer"><span class="kuerzel" aria-hidden="true">{{kuerzel $wer}}</span><span class="name">{{$wer}}</span><a href="/sso/abmelden">Abmelden</a></div>{{end}}
</header>
<main id="hauptinhalt" tabindex="-1"{{block "mainklasse" .}}{{end}}>
  {{if .Hinweis}}<div class="hinweis" role="status">{{.Hinweis}}</div>{{end}}
  {{if .Fehler}}<div class="fehler" role="alert">{{.Fehler}}</div>{{end}}
  {{template "inhalt" .}}
</main>
{{block "skripte" .}}{{end}}
</body>
</html>
