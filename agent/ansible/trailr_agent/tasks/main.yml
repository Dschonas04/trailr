---
- name: Trailr, Agent laden
  ansible.builtin.get_url:
    url: "{{ trailr_agent_quelle }}"
    checksum: "sha256:{{ trailr_agent_sha256 }}"
    dest: /usr/local/bin/trailr-agent
    mode: "0755"
    force: true
  notify: Trailr neu starten

- name: Trailr, Benutzer für den Agenten
  ansible.builtin.user:
    name: trailr
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    groups: systemd-journal
    append: true

- name: Trailr, Verzeichnis für Einstellungen
  ansible.builtin.file:
    path: /etc/trailr
    state: directory
    mode: "0700"

- name: Trailr, Einstellungen
  ansible.builtin.copy:
    dest: /etc/trailr/agent.env
    content: |
      TRAILR_HOST={{ inventory_hostname }}
      {% if trailr_server %}
      TRAILR_SERVER={{ trailr_server }}
      TRAILR_SCHLUESSEL={{ (trailr_schluessel ~ ':' ~ inventory_hostname) | hash('sha256') }}
      {% endif %}
      {% if trailr_ordner %}
      TRAILR_ORDNER={{ trailr_ordner }}
      TRAILR_ORDNER_TAGE={{ trailr_ordner_tage }}
      {% endif %}
    mode: "0600"
  no_log: true
  notify: Trailr neu starten

- name: Trailr, auditd
  when: trailr_auditd
  block:
    - name: Trailr, auditd installieren
      ansible.builtin.package:
        name: "{{ 'audit' if ansible_os_family == 'RedHat' else 'auditd' }}"
    - name: Trailr, Regeln
      ansible.builtin.copy:
        src: audit.rules
        dest: /etc/audit/rules.d/trailr.rules
        mode: "0640"
      notify: Trailr Regeln laden

- name: Trailr, Dienst
  ansible.builtin.copy:
    src: trailr-agent.service
    dest: /etc/systemd/system/trailr-agent.service
    mode: "0644"
  notify: Trailr neu starten

- name: Trailr, Dienst an
  ansible.builtin.systemd:
    name: trailr-agent
    enabled: true
    state: started
    daemon_reload: true
