services:
  trailr:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRAILR_DB: postgres://trailr:${DB_KENNWORT}@db:5432/trailr?sslmode=disable
    ports:
      - "8400:8400"
    volumes:
      - einstellungen:/einstellungen
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trailr
      POSTGRES_PASSWORD: ${DB_KENNWORT}
      POSTGRES_DB: trailr
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailr -d trailr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db:
  einstellungen:
